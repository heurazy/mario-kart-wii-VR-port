android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m
# The native libraries are already built and stripped by Build-Quest.sh; Gradle
# must not try to compress or re-page-align them, because Android 15 and the
# Quest loader both require uncompressed, 16 KiB-aligned shared objects.
android.bundle.enableUncompressedNativeLibs=true
